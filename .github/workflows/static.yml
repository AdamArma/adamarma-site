name: Publish Adam Arma site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Extract validated static release
        run: |
          mkdir -p _site
          unzip -q ADAM_ARMA_GITHUB_PAGES_READY.zip -d _site
          test -f _site/index.html
          test -f _site/ru/index.html
          test -f _site/sitemap.xml
      - name: Install Cloudflare Web Analytics
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          beacon = b"""<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "559272d701a548439eed9552232893c8"}'></script><!-- End Cloudflare Web Analytics -->"""
          closing_body = re.compile(rb"</body\s*>", re.IGNORECASE)
          installed = 0
          for page in sorted(Path("_site").rglob("*.html")):
              original = page.read_bytes()
              if b"static.cloudflareinsights.com/beacon.min.js" in original:
                  raise SystemExit(f"Unexpected existing Cloudflare beacon in {page}")
              matches = list(closing_body.finditer(original))
              if not matches:
                  print(f"Skipping HTML without a closing body: {page}")
                  continue
              offset = matches[-1].start()
              page.write_bytes(original[:offset] + beacon + b"\n" + original[offset:])
              installed += 1
          if installed < 53:
              raise SystemExit(f"Unexpectedly few pages with a beacon: {installed}")
          print(f"Installed Cloudflare Web Analytics on {installed} pages")
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
