name: Publish Adam Arma site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Extract validated static release
        run: |
          mkdir -p _site
          unzip -q ADAM_ARMA_GITHUB_PAGES_READY.zip -d _site
          test -f _site/index.html
          test -f _site/ru/index.html
          test -f _site/sitemap.xml
      - name: Validate SEO and localized pages
        run: |
          python3 - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urljoin, urlsplit
          from xml.etree import ElementTree

          site = 'https://adamarma.ru/'
          languages = 'ar bn cs de el en es fa fr he hi id it ja kk ko nl pl pt ru sv sw th tr uk uz vi zh'.split()
          home = {lang: site + lang + '/' for lang in languages}
          guide = {lang: url + 'guide/' for lang, url in home.items()}
          expected = {site, *home.values(), *guide.values()}
          root = Path('_site')

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = []
                  self.structured = []
                  self.capture = None
                  self.heading = ''
                  self.title = ''
                  self.body_text = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  self.tags.append((tag, attrs))
                  if tag in ('title','h1','script','style'):
                      self.capture = tag
                      if tag == 'script' and attrs.get('type') == 'application/ld+json':
                          self.structured.append('')
                          self.capture = 'json'

              def handle_endtag(self, tag):
                  if tag == self.capture or tag == 'script' and self.capture == 'json':
                      self.capture = None

              def handle_data(self, data):
                  if self.capture == 'json':
                      self.structured[-1] += data
                  elif self.capture == 'title':
                      self.title += data
                  elif self.capture == 'h1':
                      self.heading += data
                  elif self.capture is None:
                      self.body_text.append(data.strip())

              def attrs(self, tag):
                  return [attrs for name, attrs in self.tags if tag == name]

          robots = (root / 'robots.txt').read_text(encoding='utf-8')
          require(any(line.strip().lower() == ('Sitemap: ' + site + 'sitemap.xml').lower() for line in robots.splitlines()), 'Missing canonical sitemap declaration')
          require(not any(line.split('#',1)[0].strip().lower() == 'disallow: /' for line in robots.splitlines()), 'robots.txt blocks the entire site')
          sitemap = [e.text for e in ElementTree.parse(root / 'sitemap.xml').findall('{*}url/{*}loc')]
          require(set(sitemap) == expected and len(sitemap) == len(expected), 'Unexpected canonical URLs in sitemap')
          require((root / '.nojekyll').is_file(), 'Missing .nojekyll')
          descriptions, titles = set(), set()
          for url in sorted(expected):
              route = url.removeprefix(site)
              lang = route.split('/')[0] or 'en'
              page = Page()
              page.feed((root / route / 'index.html').read_text(encoding='utf-8'))
              page.close()
              metas = page.attrs('meta')
              meta = {a.get('name') or a.get('property'): a.get('content') or '' for a in metas}
              html = page.attrs('html')[0]
              direction = 'rtl' if lang in ('ar','fa','he') else 'ltr'
              require(html.get('lang') == lang and html.get('dir') == direction, f'{url}: language or direction')
              description = meta.get('description','').strip()
              require(page.title.strip() and page.title not in titles, f'{url}: missing or duplicate title')
              require(description and description not in descriptions, f'{url}: missing or duplicate description')
              descriptions.add(description)
              titles.add(page.title)
              require(len(page.attrs('h1')) == 1 and page.heading.strip(), f'{url}: missing or duplicate H1')
              require(sum(map(len,page.body_text)) >= 225, f'{url}: missing readable content')
              for tag in metas:
                  if tag.get('name','').lower() in ('robots','googlebot','yandex','bingbot'):
                      require('noindex' not in tag.get('content','').lower(), f'{url}: noindex')
              links = page.attrs('link')
              require([a.get('href') for a in links if a.get('rel')=='canonical'] == [url], f'{url}: canonical mismatch')
              mapping = guide if route.endswith('/guide/') else home
              default = guide['en'] if mapping is guide else site
              alternates = [(a['hreflang'],a.get('href')) for a in links if a.get('rel')=='alternate' and 'hreflang' in a]
              require(len(alternates)==29 and dict(alternates)=={**mapping,'x-default': default}, f'{url}: incorrect hreflang')
              require(all(meta.get(k) for k in ('og:title','og:description','og:image','twitter:card')), f'{url}: social preview incomplete')
              require(meta.get('og:url')==url, f'{url}: Open Graph URL')
              require(page.structured and all(isinstance(json.loads(s),(list,dict)) for s in page.structured), f'{url}: JSON-LD')
              anchors = {urljoin(url,a['href']) for a in page.attrs('a') if a.get('href')}
              if route and mapping is home:
                  ids = {a.get('id') for _,a in page.tags}
                  require({'orbit','positive','negative','replay','read-transition'} <= ids, f'{url}: formula controls missing')
                  require(guide[lang] in anchors, f'{url}: no link to localized guide')
              elif mapping is guide:
                  checked = {p.split('/guide/')[0]+'/guide/' for p in anchors if '/guide/' in p}
                  require(set(guide.values()) <= checked, f'{url}: missing guide language links')
              else:
                  require(set(home.values()) <= anchors, f'{url}: language menu incomplete')
              scripts = [a.get('src','') for a in page.attrs('script')]
              require(any('/analytics/yandex.' in s for s in scripts) and any('/analytics/analytics.' in s for s in scripts), f'{url}: analytics loader missing')
              if route:
                  require(any('/share/share.' in s for s in scripts), f'{url}: share script missing')
              assets = [(a.get(k) or '') for t,k in (('a','href'),('link','href'),('script','src'),('img','src')) for a in page.attrs(t)]
              assets.append(meta['og:image'])
              for href in set(assets):
                  if not href or href.startswith('#'):
                      continue
                  target = urlsplit(urljoin(url,href))
                  require(target.scheme in ('http','https','mailto','tel'), f'{url}: unsupported link protocol')
                  if target.netloc == 'adamarma.ru':
                      p = root / unquote(target.path).lstrip('/')
                      require(p.is_file() or (p/'index.html').is_file(), f'{url}: missing target {target.path}')

          print(f'Validated {len(expected)} canonical pages across {len(languages)} languages')
          PY
      - name: Install Cloudflare Web Analytics
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          beacon = b"""<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "559272d701a548439eed9552232893c8"}'></script><!-- End Cloudflare Web Analytics -->"""
          closing_body = re.compile(rb"</body\s*>", re.IGNORECASE)
          installed = 0
          for page in sorted(Path("_site").rglob("*.html")):
              original = page.read_bytes()
              if b"static.cloudflareinsights.com/beacon.min.js" in original:
                  raise SystemExit(f"Unexpected existing Cloudflare beacon in {page}")
              matches = list(closing_body.finditer(original))
              if not matches:
                  print(f"Skipping HTML without a closing body: {page}")
                  continue
              offset = matches[-1].start()
              page.write_bytes(original[:offset] + beacon + b"\n" + original[offset:])
              installed += 1
          if installed < 53:
              raise SystemExit(f"Unexpectedly few pages with a beacon: {installed}")
          print(f"Installed Cloudflare Web Analytics on {installed} pages")
          PY
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for GitHub Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            artifact_id=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name="$ARTIFACT_NAME" --jq '.artifacts[0].id' || true)
            if [[ -n "$ARTIFACT_ID" && "$artifact_id" == "$ARTIFACT_ID" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::GitHub Pages artifact metadata did not become available."
          exit 1
      - name: Deploy verified artifact to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          oidc_token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er .value)
          printf '::add-mask::%s\n' "$oidc_token"
          payload=$(jq -n --argjson artifact "$ARTIFACT_ID" --arg commit "$GITHUB_SHA" --arg token "$oidc_token" '{artifact_id: $artifact, pages_build_version: $commit, oidc_token: $token}')
          endpoint="repos/$GITHUB_REPOSITORY/pages/deployments"
          deployment=$(gh api --method POST "$endpoint" --input - <<< "$payload")
          deployment_id=$(jq -er .id <<< "$deployment")
          page_url=$(jq -er .page_url <<< "$deployment")
          for attempt in {1..120}; do
            status=$(gh api "$endpoint/$deployment_id" --jq .status || true)
            case "$status" in
              succeed)
                printf 'page_url=%s\n' "$page_url" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "::error::GitHub Pages returned $status."
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "::error::Timed out waiting for GitHub Pages."
          exit 1
